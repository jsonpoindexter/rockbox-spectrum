name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 imagemagick
      - name: Run portable checks
        run: python3 tools/test.py --output reports/portable
      - name: Retain reports only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-reports
          path: reports/portable
          retention-days: 7
          if-no-files-found: warn

  arm64:
    name: ARM64 builds
    needs: portable
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare work and report directories
        run: mkdir -p "$RUNNER_TEMP/spectrum-work" "$RUNNER_TEMP/spectrum-reports" "$RUNNER_TEMP/spectrum-toolchain"
      - name: Restore exact toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/spectrum-toolchain
          key: arm64-toolchain-${{ hashFiles('Dockerfile', 'toolchain-inputs.json', 'tools/bootstrap-toolchain.py') }}
      - name: Build pinned environment
        run: docker build --platform linux/arm64 -t rockbox-spectrum-builder:ci .
      - name: Build and verify
        run: |
          docker run --rm --platform linux/arm64 \
            --mount "type=bind,src=$PWD,dst=/project,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/spectrum-work,dst=/work" \
            --mount "type=bind,src=$RUNNER_TEMP/spectrum-toolchain,dst=/opt/toolchain" \
            --mount "type=bind,src=$RUNNER_TEMP/spectrum-reports,dst=/reports" \
            rockbox-spectrum-builder:ci \
            python3 /project/tools/ci-build.py --work /work/run --reports /reports --jobs 4
      - name: Retain reports only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-build-reports
          path: ${{ runner.temp }}/spectrum-reports
          retention-days: 7
          if-no-files-found: warn
